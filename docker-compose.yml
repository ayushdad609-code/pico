# Pico ₹0 Backend Docker Compose
# Based on 32_FREE_BACKEND.pdf (§1 Stack at a Glance, §2 Oracle Always Free)
# Designed to fit comfortably within 2 OCPU / 12 GB RAM

version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: pico_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pico_api
    restart: unless-stopped
    command: python3 -m pico.api --port 8080
    ports:
      - "8080:8080"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pico_worker
    restart: unless-stopped
    command: python3 -m pico.heartbeat_daemon
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
